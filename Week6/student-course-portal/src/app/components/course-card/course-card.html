<div appHighlight="lightblue">

  <h3>{{ course.name }}</h3>

  <p>Code: {{ course.code }}</p>

  <p>{{ course.credits | creditLabel }}</p>

  <button *ngIf="!isEnrolled()" (click)="enroll()">
    Enroll
  </button>

  <button *ngIf="isEnrolled()" (click)="unenroll()">
    Unenroll
  </button>

  <hr>

</div>
