<h2>Enrollment Request Form</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <label>Student Name</label><br>
  <input
    type="text"
    name="studentName"
    [(ngModel)]="student.studentName"
    #nameCtrl="ngModel"
    required
    minlength="3">

  <div *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
    Name is required
  </div>

  <div *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
    Name must be at least 3 characters
  </div>

  <br><br>

  <label>Email</label><br>
  <input
    type="email"
    name="studentEmail"
    [(ngModel)]="student.studentEmail"
    #emailCtrl="ngModel"
    required
    email>

  <div *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">
    Email is required
  </div>

  <div *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">
    Enter a valid email
  </div>

  <br><br>

  <label>Course ID</label><br>
  <input
    type="number"
    name="courseId"
    [(ngModel)]="student.courseId"
    #courseCtrl="ngModel"
    required>

  <div *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
    Course ID is required
  </div>

  <br><br>

  <label>Preferred Semester</label><br>

  <select
    name="preferredSemester"
    [(ngModel)]="student.preferredSemester">

    <option>Odd</option>
    <option>Even</option>
  </select>

  <br><br>

  <input
    type="checkbox"
    name="agreeToTerms"
    [(ngModel)]="student.agreeToTerms"
    #termsCtrl="ngModel"
    required>

  I Agree to Terms

  <div *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">
    Accept Terms
  </div>

  <br><br>

  <button type="submit" [disabled]="enrollForm.invalid">
    Submit
  </button>

  <button type="button" (click)="resetForm(enrollForm)">
    Reset
  </button>

</form>
